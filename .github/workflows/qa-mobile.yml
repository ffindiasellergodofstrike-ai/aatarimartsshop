name: ATTIRE MART mobile browser QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-mobile.yml'
      - 'scripts/qa-mobile.mjs'
      - 'app.js'
      - 'checkout.js'
      - 'styles.css'
      - 'assets/**'
      - 'data/**'
      - 'media/**'
      - 'scripts/qa-all-pages.mjs'
      - 'scripts/build-public.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install storefront and browser test dependencies
        run: |
          npm install --no-audit --no-fund --package-lock=false
          npm install --no-audit --no-fund --package-lock=false --no-save playwright@1.58.0
          npx playwright install --with-deps chromium firefox webkit
      - name: Build static site
        run: npm run build
      - name: Test Chrome Firefox Safari viewports, original logo, bag cap and legal checkout
        run: node scripts/qa-mobile.mjs
